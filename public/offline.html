<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D2455" />
    <title>You're offline · NuMind</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font:
          15px/1.6 "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        background: radial-gradient(120% 120% at 50% 0%, #183771 0%, #0d2455 55%, #081833 100%);
        color: #ffffff;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        text-align: center;
        padding: 2.25rem 1.75rem;
        border-radius: 1.75rem;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(6px);
      }
      img {
        width: 84px;
        height: 84px;
        border-radius: 999px;
        box-shadow: 0 12px 40px -12px rgba(2, 138, 255, 0.75);
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 1.75rem;
        color: rgba(255, 255, 255, 0.75);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        justify-content: center;
      }
      a,
      button {
        font: inherit;
        font-weight: 700;
        padding: 0.7rem 1.35rem;
        border-radius: 999px;
        border: 1px solid transparent;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        background: #028aff;
        color: #ffffff;
      }
      .secondary {
        background: transparent;
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.35);
      }
      .hint {
        margin: 1.5rem 0 0;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="NuMind" width="84" height="84" />
      <h1>You're offline</h1>
      <p>
        NuMind needs a connection for this page. Pages you've already visited still work, and
        anything you do while offline syncs when you're back.
      </p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Try again</button>
        <a class="secondary" href="/">Go home</a>
      </div>
      <p class="hint">Numi is an AI wellness companion, not a healthcare professional.</p>
    </div>
  </body>
</html>
